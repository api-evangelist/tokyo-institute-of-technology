note: >-
  This institution publishes no OAuth 2.0 or OpenID Connect developer API. Its authentication
  posture is entirely federated SAML: a Shibboleth Identity Provider registered in GakuNin,
  Japan's national academic access management federation. That is a real, machine-readable,
  institution-operated interface — it is simply not a developer API, and must not be counted as
  one. The one public harvesting endpoint the institution runs (T2R2 OAI-PMH) requires no
  authentication at all.
