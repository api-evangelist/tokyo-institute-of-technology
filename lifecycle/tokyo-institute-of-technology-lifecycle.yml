institution_context:
  merger:
    date: '2024-10-01'
    detail: >-
      Tokyo Institute of Technology merged with Tokyo Medical and Dental University to form the
      Institute of Science Tokyo (Science Tokyo). The estate is still visibly mid-migration: the
      corporate web presence has moved to isct.ac.jp, academic and service systems remain on
      titech.ac.jp (t2r2.star, libra, gsic, educ, portal), and the institutional repository on
      JAIRO Cloud still identifies itself by the pre-merger medical-side name. Any surface
      inventory taken here has a short half-life.
