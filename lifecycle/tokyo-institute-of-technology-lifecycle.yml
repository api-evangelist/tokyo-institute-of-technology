  base: https://t2r2.star.titech.ac.jp/oaipmh/OAIHandler
  stability_marking: >-
    None in-band. OAI-PMH pins its own protocolVersion (2.0) in every response envelope; the
    institution advertises no service version of its own.
deprecation:
