note: >-
  The single institution-operated machine-readable surface in this profile — the T2R2 OAI-PMH
  endpoint — is in a published wind-down. This is not inference: the operator posted a dated
  discontinuation schedule with named successor systems, and the T2R2 English landing page now
  redirects to it. Recorded here so that a future re-profile can tell a retired surface from a
  surface we simply failed to find, and so the catalog does not keep scoring a dead endpoint.
