      The only vendor name in the endpoint's self-description is OCLC's OAICat, which is the
      open-source software the institution deploys, not a hosted platform it rents.
    description: >-
      OAI-PMH 2.0 metadata harvesting interface for T2R2, the Science Tokyo / Tokyo Tech Research
      Repository, operated by the university library on the institution's own host. Repository name
      "T2R2 -Tokyo Tech Research Repository-", protocol version 2.0, earliest datestamp
      2008-05-01, metadata prefixes oai_dc and junii2, gzip and deflate compression, no set
      hierarchy. No signup, no key, no rate limits. Verified live on 2026-08-30 across Identify,
      ListMetadataFormats, ListIdentifiers, ListSets and two error paths. SUNSET: the operator's
      notice of 2026-07-22 ended T2R2 search on 2026-08-20 and ends registration on 2026-10-01 —
