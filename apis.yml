  - aid: tokyo-institute-of-technology:t2r2-oaipmh
    name: T2R2 Research Repository OAI-PMH
    description: >-
      OAI-PMH 2.0 metadata harvesting interface for T2R2, the Science Tokyo /
      Tokyo Tech Research Repository operated by GSIC and the university
      library. Exposes records (papers, theses, manuscripts, patents) for open
      harvesting with no signup required. Built on OCLC's OAICat framework;
      repository name "T2R2 -Tokyo Tech Research Repository-", protocol version
      2.0. Verified live returning a valid Identify response.
