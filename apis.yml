  - aid: tokyo-institute-of-technology:science-tokyo-repository-oaipmh
    name: Science Tokyo Repository OAI-PMH (JAIRO Cloud tenant)
    x-operator: tenant
    x-operator-evidence: >-
      Host isct.repo.nii.ac.jp is an institution-specific subdomain on repo.nii.ac.jp, the JAIRO
      Cloud platform jointly operated by the National Institute of Informatics and the Japan
      Consortium for Open Access Repository, running WEKO3. The Identify response names adminEmail
      somu-lib@ml.tmd.ac.jp. The deposited content, the DOIs and the institutional identity are the
      university's; the contract and the software are the platform's. The generic WEKO3 / JAIRO
      Cloud specification is deliberately NOT saved into this repo.
    description: >-
      OAI-PMH 2.0 endpoint for the institution's tenancy on JAIRO Cloud — the successor repository
      named in the T2R2 discontinuation notice as the destination for full-text research outputs.
      Identify returns repositoryName "Tokyo Medical and Dental University Institutional
      Repository" (the pre-merger medical-side name, not yet re-branded), protocolVersion 2.0,
      earliestDatestamp 2017-04-27. Recorded here as a tenant relationship — a real institutional
      fact and one of the few programmable surfaces this university has — not as institution-built
      engineering.
    humanURL: https://isct.repo.nii.ac.jp/
    baseURL: https://isct.repo.nii.ac.jp/oai
    tags: [ Repository, OAI-PMH, Research, Open Access, Metadata, Tenant, JAIRO Cloud, WEKO3 ]
    properties:
