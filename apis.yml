  - aid: tokyo-institute-of-technology:ex-tic-gakunin-entity
    name: EX-TIC GakuNin SAML entity (tenant)
    x-operator: tenant
    x-operator-evidence: >-
      Host isct.ex-tic.com is an institution-specific subdomain on ex-tic.com, a commercial
      platform. The GakuNin aggregate registers it with OrganizationName "Institute of Science
      Tokyo" and OrganizationURL https://www.tmd.ac.jp — the institution's identity on a vendor's
      infrastructure.
    description: >-
      A second GakuNin-registered SAML 2.0 entity carrying the Institute of Science Tokyo identity,
      hosted on the commercial EX-TIC platform and pointing at the pre-merger medical/dental side of
      the institution. Advertises SAML 2.0 HTTP-POST and HTTP-Redirect assertion endpoints. A bare
      GET returns HTTP 400 because the endpoint expects a POSTed assertion — correct behaviour for
      an assertion consumer, not a dead host. Recorded so the operator split inside the merged
      institution's identity estate is visible: one federation entity the university runs itself,
      one it rents.
    humanURL: https://metadata.gakunin.nii.ac.jp/gakunin-metadata.xml
    baseURL: https://isct.ex-tic.com/auth/gakunin/saml2/assertions
    tags: [ Authentication, Identity, SAML, GakuNin, Tenant ]
