x-coverage:
  state: covered
  reason: covered
  detail: >-
    Probed on 2026-08-30 across 30+ URLs on isct.ac.jp, titech.ac.jp and the national
    infrastructure the institution federates into. The profile is thin because the institution's
    machine-readable footprint IS thin, not because we could not reach it: there is no developer
    portal, no REST API, no open-data portal and no OAuth/OIDC surface on any institution host.
    Everything institution-operated that we found is protocol-level — one OAI-PMH 2.0 endpoint and
    one Shibboleth/SAML IdP in the GakuNin federation aggregate — and the OAI-PMH one carries a
    published sunset (search ended 2026-08-20, registration ends 2026-10-01). Two further surfaces
    are tenant relationships on national and commercial platforms and are recorded as such rather
    than credited to the university. Three notes on what we could NOT read: isct.repo.nii.ac.jp
    returns HTTP 406 to a plain curl User-Agent and serves normally to a browser-class client, so
    it was read that way and graded live; www.ocw.titech.ac.jp resolves but times out on every
    connection, with no successor notice found; and the generative-AI guideline, research policy
    and research-data policy are PDFs behind a CMS download plugin whose URL key rotates per
    request, so the AIPolicy pointer targets the stable policies page that carries them rather than
    an unstable file URL. Search was run in Japanese as well as English.
