aid: tokyo-institute-of-technology
name: Tokyo Institute of Technology
x-type: university
x-category: Institute of Technology
description: >-
  Tokyo Institute of Technology (Tokyo Tech / Titech) was Japan's leading national institute of
  technology and ranked #76 in the QS World University Rankings 2025. On 2024-10-01 it merged with
  Tokyo Medical and Dental University to form the Institute of Science Tokyo (Science Tokyo); the
  corporate web presence moved to isct.ac.jp while most academic and service systems still run on
  titech.ac.jp. Its institution-operated programmable footprint is small and, as of 2026-08-30,
  shrinking. There is no developer portal, no public REST API, no open-data portal and no OAuth or
  OpenID Connect surface anywhere on its domains. What the institution genuinely operates and we
  verified live is two protocol endpoints: the T2R2 research repository's OAI-PMH 2.0 harvesting
  interface (oai_dc and junii2), and a Shibboleth/SAML 2.0 Identity Provider registered in GakuNin,
  Japan's national academic access management federation. The first is being switched off — the
  operator published a discontinuation schedule on 2026-07-22 that ended T2R2 search on 2026-08-20
  and ends T2R2 registration on 2026-10-01, moving full text to the Science Tokyo Repository on
  JAIRO Cloud, which is a TENANT surface run by NII and JPCOAR rather than by the university. The
  library discovery layer, the syllabus system, the STRDB researcher database and the TSUBAME4
  supercomputer service are all real institution-run systems with human interfaces only — none of
  them publishes a machine-readable contract.
