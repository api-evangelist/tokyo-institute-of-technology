  - aid: tokyo-institute-of-technology:gakunin-shibboleth
    name: GakuNin Shibboleth Identity Provider (SAML 2.0)
    x-operator: institution
    x-operator-evidence: >-
      Entity https://idp-gakunin.nap.gsic.titech.ac.jp/idp/shibboleth is present in the live
      GakuNin federation aggregate with OrganizationName "Institute of Science Tokyo" and
      OrganizationURL https://portal.titech.ac.jp/. The IdP host is under titech.ac.jp and is run
      by the institution's own information infrastructure centre.
    description: >-
      Shibboleth / SAML 2.0 Identity Provider for institutional single sign-on, registered in
      GakuNin, Japan's national academic access management federation operated by NII. Advertises
      the Shibboleth 1.0 AuthnRequest profile, SAML 2.0 SSO over HTTP-POST and HTTP-Redirect, and
      SAML 1.0 / 2.0 SOAP AttributeQuery on port 8443. Published SAML metadata inside a national
      federation aggregate is the most machine-readable interface this institution operates. It is
      a federated authentication endpoint for institutional login, NOT a public OAuth or OpenID
      Connect developer API, and must not be counted as one. Verified 2026-08-30 in the live
      federation metadata document.
    humanURL: https://www.gakunin.jp/en
