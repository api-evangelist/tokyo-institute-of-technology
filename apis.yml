aid: tokyo-institute-of-technology
name: Tokyo Institute of Technology
description: >-
  Tokyo Institute of Technology (Tokyo Tech / Titech) was a national research
  university in Tokyo, Japan, ranked #76 in the QS World University Rankings
  2025. In October 2024 it merged with Tokyo Medical and Dental University to
  form the Institute of Science Tokyo (Science Tokyo), and its public web
  presence now lives primarily at isct.ac.jp while legacy titech.ac.jp services
  remain online. Its public, machine-readable developer footprint is limited:
  the most clearly documented programmatic interface is the T2R2 (Science Tokyo
  / Tokyo Tech Research Repository) OAI-PMH metadata harvesting endpoint.
  Identity is federated through GakuNin using Shibboleth/SAML rather than a
  public OAuth/OpenID Connect API. No official institution-wide REST developer
  portal or open-data API was found.
