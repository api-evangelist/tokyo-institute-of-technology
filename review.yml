        note: STRDB researcher database, institution-operated, HTML only — no machine-readable interface.
      - url: https://syllabus.s.isct.ac.jp/
        status: 200
        note: Course catalog, institution-operated, HTML only. robots.txt allows all; no API.
      - url: https://www.t4.cii.isct.ac.jp/docs/
