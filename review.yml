reviews:
  - date: '2026-08-30'
    rating: 2
    summary: >-
      Re-profiled under the API Evangelist university pipeline, which settles WHO OPERATES each
      surface before saving anything. Four surfaces are recorded, two institution-operated and two
      tenant. Institution-operated: the T2R2 research repository OAI-PMH 2.0 endpoint on the
      university's own host (Identify, ListMetadataFormats, ListIdentifiers, ListSets and two error
      paths all verified live; prefixes oai_dc and junii2; no set hierarchy; no auth), and the
      Shibboleth/SAML 2.0 Identity Provider, confirmed by name inside the live GakuNin national
      federation aggregate as OrganizationName "Institute of Science Tokyo". Tenant: the Science
      Tokyo Repository on JAIRO Cloud (isct.repo.nii.ac.jp, WEKO3, operated by NII and JPCOAR — the
      data is the university's, the contract is the platform's, so the platform's generic spec is
      deliberately NOT saved here), and a second GakuNin SAML entity hosted on the commercial EX-TIC
      platform. The material new finding is a LIFECYCLE one: the institution published a
      discontinuation schedule on 2026-07-22 retiring T2R2 and STAR Search. T2R2 search ended
      2026-08-20; registration ends 2026-10-01; STAR Search already returns HTTP 500. The single
      institution-operated API surface in this profile is therefore in wind-down, with the successor
      being a tenant platform — the university's programmable footprint is about to become smaller
      and less its own. Still no developer portal, no REST API, no open-data portal and no
      OAuth/OIDC on any institution host. An institutional GitHub org was found and confirmed
      (github.com/science-tokyo, blog isct.ac.jp, created 2024-12-25, publishing the MIT-licensed
      Science Tokyo UI front-end), replacing the previous lab-only pointer. No fabricated endpoints;
      no vendor contract saved under this institution's slug.
    endpoints:
      - url: https://t2r2.star.titech.ac.jp/oaipmh/OAIHandler?verb=Identify
        status: 200
        note: Valid OAI-PMH 2.0 Identify. Institution-operated. Sunset scheduled.
      - url: https://t2r2.star.titech.ac.jp/oaipmh/OAIHandler?verb=ListMetadataFormats
        status: 200
        note: 'Prefixes: oai_dc, junii2.'
      - url: https://t2r2.star.titech.ac.jp/index_en.html
        status: 200
        note: Redirects to the 2026-07-22 discontinuation notice for T2R2 and STAR Search.
      - url: https://search.star.titech.ac.jp/
        status: 500
        note: STAR Search already failing ahead of its announced 2026-10-01 shutdown.
      - url: https://metadata.gakunin.nii.ac.jp/gakunin-metadata.xml
        status: 200
        note: >-
          5.66 MB GakuNin federation aggregate. Contains the institution's IdP entity
          (idp-gakunin.nap.gsic.titech.ac.jp) and a tenant entity on isct.ex-tic.com.
      - url: https://idp-gakunin.nap.gsic.titech.ac.jp/idp/shibboleth
