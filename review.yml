          JAIRO Cloud tenant. 406 is the platform edge blocking a curl User-Agent; serves normally
          to a browser-class client, where /oai?verb=Identify returns a valid OAI-PMH 2.0 response.
          Live, not dead.
      - url: https://isct.ex-tic.com/auth/gakunin/saml2/assertions
        status: 400
        note: SAML assertion consumer expecting POST. Tenant surface. Live, not dead.
      - url: https://strdb.s.isct.ac.jp/html/home_en.html
