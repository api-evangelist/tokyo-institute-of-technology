- id: oneroster
  conforms: false
  evidence: No OneRoster endpoint. The syllabus system at https://syllabus.s.isct.ac.jp/ (HTTP 200) is HTML only.
- id: ed-fi
  conforms: false
  evidence: Ed-Fi is a US K-12/state-longitudinal standard with no adoption path in the Japanese national-university sector; no surface found.
- id: caliper
