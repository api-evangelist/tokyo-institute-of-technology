- name: ListMetadataFormats
  request: GET https://t2r2.star.titech.ac.jp/oaipmh/OAIHandler?verb=ListMetadataFormats
  status: 200
  response_summary: 'Two metadataPrefix values returned: oai_dc, junii2.'
  reading: junii2 is the NII national institutional-repository schema; supporting it is what makes this repository harvestable into IRDB and CiNii Research.
